[project]
name = "finn-api"
version = "0.1.0"
description = "FINN: investor agent API, NSE sources and per-company brains"
readme = "README.md"
authors = [
    { name = "rdksupe", email = "rishikirti534@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
finn-api = "finn_api:main"
finn = "finn_api.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
research = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE"]
ignore = [
  "B008",   # FastAPI Depends() / File() in defaults is idiomatic
  "E501",   # line length — leave to formatter preference
]
